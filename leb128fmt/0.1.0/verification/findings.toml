[[report.findings]]
title = "Unsigned decoders accept values outside widths below seven bits"
body = '''
## Description

In `leb128fmt` 0.1.0, `decode_uint_slice` and functions generated by `decode_uint_arr!` return a one-byte value without checking whether it fits the requested width. For example, 127 does not fit in an unsigned one-bit value.

## Steps to Reproduce

```rust
let mut pos = 0;
let result = leb128fmt::decode_uint_slice::<u8, 1>(&[127], &mut pos);
assert!(result.is_err());
```

## Expected Behavior

The decoder should reject the value because the requested width can represent only 0 and 1.

## Actual Behavior

The assertion fails: the function returns `Ok(127)` and advances `pos` to 1. With the same type and width, `[0x80, 0x01]` returns `Ok(128)` and `[0x80, 0x02]` returns `Ok(0)`; both advance the cursor by two bytes.

## Environment

`leb128fmt` 0.1.0, default features.
'''

[[report.findings]]
title = "Signed slice encoders accept values outside the requested width"
body = '''
## Description

In `leb128fmt` 0.1.0, `encode_sint_slice` and `encode_fixed_sint_slice` accept some values outside the requested signed width. In particular, 128 cannot be represented as a signed 8-bit value.

## Steps to Reproduce

```rust
let mut output = [0; 2];
let mut pos = 0;
let result = leb128fmt::encode_sint_slice::<i16, 8>(128, &mut output, &mut pos);
assert_eq!(result, None);
```

## Expected Behavior

The encoder should return `None`: the signed 8-bit range is -128 through 127.

## Actual Behavior

The assertion fails: the function returns `Some(2)`, writes `[0x80, 0x01]`, and advances `pos` to 2. The fixed-length slice encoder also accepts this value. With width 7, value 127, and a one-byte output, the fixed encoder panics while attempting to write a second byte.

## Environment

`leb128fmt` 0.1.0, default features.
'''

[[report.findings]]
title = "Fixed unsigned array encoder panics at a seven-bit width"
body = '''
## Description

In `leb128fmt` 0.1.0, a function generated by `encode_fixed_uint_arr!` for a seven-bit width panics even for a representable value.

## Steps to Reproduce

```rust
leb128fmt::encode_fixed_uint_arr!(encode_u7, u8, 7);
assert_eq!(encode_u7(0), Some([0]));
```

## Expected Behavior

Zero fits in seven bits and should encode as the single byte `[0]`.

## Actual Behavior

The call panics with an index-out-of-bounds error (index 1, length 1).

## Environment

`leb128fmt` 0.1.0, default features.
'''

[[report.findings]]
title = "Decoders mishandle continuation at a seven-bit width"
body = '''
## Description

In `leb128fmt` 0.1.0, a function generated by `decode_uint_arr!` for a seven-bit width panics when the only input byte has its continuation bit set. At the same width, `decode_uint_slice` and `decode_sint_slice` can consume an extra byte instead of rejecting the continuation.

## Steps to Reproduce

```rust
leb128fmt::decode_uint_arr!(decode_u7, u8, 7);
assert_eq!(decode_u7([0x80]), None);
```

## Expected Behavior

The array has no terminating byte, so the decoder should return `None` for the incorrect encoding.

## Actual Behavior

The call panics with an index-out-of-bounds error (index 1, length 1). For `[0xff, 0x00]`, the slice decoders with width 7 return `Ok(127)` and advance the cursor by two bytes. The signed result also exceeds the signed seven-bit range of -64 through 63.

## Environment

`leb128fmt` 0.1.0, default features.
'''
