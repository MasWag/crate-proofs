[report]
title = "Selected LEB128 codecs and error operations in leb128fmt 0.1.0"
explanation = '''
For every `u32` or `u64`, `encode_u32` or `encode_u64` returns the shortest unsigned LEB128 encoding and its length in an array; unused bytes are zero. The corresponding fixed encoders return five or ten bytes respectively, with continuation bits on all but the last byte. For every input array, `decode_u32` or `decode_u64` returns the value and length of the first terminated unsigned LEB128 encoding when its value fits in the corresponding width, and `None` otherwise. Padding is accepted. Bytes after the first terminator do not affect the result.

For every `i32` or `i64`, the corresponding `encode_s32` or `encode_s64` returns the shortest signed LEB128 encoding and its length; unused array bytes are zero. The fixed signed encoders return the full five- or ten-byte representation with sign extension and continuation bits on all but the last byte. The corresponding signed decoders return the signed value and length of the first terminated encoding if it fits in the corresponding width, and `None` otherwise. They accept padding, and bytes following the first terminator do not affect the result.

For `encode_uint_slice` with any supported unsigned primitive, widths from 0 through the storage width and a cursor at or before the buffer end, the value is rejected without changing buffer or cursor when it does not fit the width. Otherwise the function writes its shortest encoding and advances the cursor when there is space. If space runs out, it writes the prefix that fits, returns `None`, and preserves the cursor; bytes outside that prefix are unchanged. For `encode_fixed_uint_slice` with any supported unsigned primitive at widths 1 through the storage width and a cursor at or before the buffer end, the function writes exactly `ceil(BITS / 7)` bytes and advances the cursor when the value fits and space is sufficient. Otherwise it returns `None` with the entire buffer and cursor unchanged.

For `decode_uint_slice` with `u8`, `u16`, `u32`, `u64`, or `u128`, widths from 7 through the storage width, the checked result follows the first terminating byte and preserves the cursor on errors. At widths divisible by seven, the release permits an additional group whose terminal payload is zero; this differs from rejecting a continuation at the requested maximum length. For widths below seven, the decoder returns a first terminal byte unchanged even when it exceeds the requested width. On continued input it accumulates payload groups with each shifted contribution reduced modulo `2^N`, where `N` is the storage width in bits, without enforcing the requested field width. It returns more-bytes-needed if input ends before the next group. If a next byte is present when the shift reaches or exceeds the storage width, the translated execution produces an integer-overflow failure. This last statement describes the checked model and does not assert native behavior under every overflow setting. The signed slice decoder is checked for `i16`, `i32`, `i64`, and `i128` at widths from zero through the storage width. It reads at most `floor(BITS / 7) + 1` groups, tests values against an effective signed width of `BITS + 1` when `BITS` is divisible by seven and `BITS` otherwise, and preserves the cursor on errors. In the bounded-group cases above, an exhausted input yields the more-bytes-needed error before the group limit, and an invalid final group yields invalid-encoding. When any of these signed or unsigned decoders is requested to use a width exceeding its storage width, the checked execution reaches an assertion failure; that is a failure characterization, not a success guarantee.

For `encode_sint_slice` with any supported signed primitive and a cursor at or before the buffer end, a value rejected by the release guard leaves the state unchanged. An accepted value is written in its shortest signed encoding when it fits; on short capacity the fitting prefix is written and the cursor is preserved; bytes outside the written interval are unchanged. For the fixed signed writer at widths 1 through the storage width, rejection or short capacity leaves the state unchanged. When capacity is sufficient, an accepted value must fit the available groups for the checked successful-encoding guarantee. That group-fit condition holds for every value representable in the requested signed field. At narrower widths the release guard also accepts some values outside that field; the fixed guarantee does not cover an accepted value needing more groups than the field provides.

The derived `Error` clone and equality operations preserve and compare variants; the inherited `clone_from` and inequality operations respectively copy the source variant and return the complement of equality. The inherited, doc-hidden `Eq::assert_receiver_is_total_eq` method returns unit for each `Error`. The inherited deprecated `std::error::Error::description` returns `description() is deprecated; use Display`. Checked observers calling `source` and the deprecated `cause` report `None` for both error variants. The `UInt::BITS` and `SInt::BITS` constants equal the widths of their respective primitive types.

The error predicates `is_more_bytes_needed` and `is_invalid_encoding` return true exactly for their respective error variants. `is_last` returns true exactly when the byte is below 128. `max_len` returns the ceiling of the bit width divided by seven, including zero for zero bits. The successful-execution contracts exclude modeled execution failure for their stated inputs.
'''
trusted_assumptions = '''
The concrete writer proofs use a local adapter for the extracted primitive conversions. It erases the generated conversion error payload to the pinned backend’s unit error model; the proofs establish that narrowing the masked payload succeeds and preserves its value, so that error payload is not observed in the proved paths. The adapter also forwards the fixed writer’s length helper to a separately extracted release body. This connection relies on the extracted operations and their correspondence to Rust. The results depend on the correspondence of the pinned Rust-to-Lean translation and Aeneas models for integer arithmetic, shifts, indexing and arrays to the Rust operations, and on Lean's kernel. They do not independently establish that correspondence.
'''
limitations = '''
The slice claims are restricted to the types, widths and cursor conditions stated above. The unsigned small-width decoder claim describes the implementation's actual behavior, including modeled failure, rather than the intended field-range contract. The actual decoder behavior at multiples of seven is broader than the intended field limit, as the findings illustrate. Parameterized array macro expansions at other widths, error formatting and the full dynamic return signatures of the standard error `source` and deprecated `cause` methods remain outside the proved scope. The observers establish only whether those methods return `None`. Native observations in `verification/findings/` are separate from the formal results.

'''
environment = '''
The profile uses the unchanged executable source of the pinned 0.1.0 registry release, with no crate source adaptation, unpatched Aeneas and Charon revisions, and Lean 4.35.0 on `aarch64-apple-darwin`. The original concrete array and helper extraction uses default features; the slice and concrete-writer harnesses select the release dependency with default features disabled; the inherited error-default and error-observer harnesses use default features. The Rust harness functions call the original release bodies or actual trait dictionaries; the error observers use optimized MIR and check the result of those actual calls. Local proofs-rs CLI patches prepare pinned inputs and adjust API discovery; they do not change the Lean models or contracts. The profile specification, source and tool locks, theorem inventory and results record describe the scope and supporting run.
'''

