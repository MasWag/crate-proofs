srcDir = "Generated/@TARGET@"

[[lean_lib]]
name = "ProofsSigned32"

[[lean_lib]]
name = "Signed64"
srcDir = "Generated/@TARGET@"

[[lean_lib]]
name = "ProofsSigned64"

[[lean_lib]]
name = "SignedDecodeMath"

[[lean_lib]]
name = "LebErrors"
srcDir = "Generated/@TARGET@"

[[lean_lib]]
name = "ProofsErrors"

[[lean_lib]]
name = "SliceConcrete"
srcDir = "Generated/@TARGET@"

[[lean_lib]]
name = "LebErrorDefaults"
srcDir = "Generated/@TARGET@"

[[lean_lib]]
name = "ProofsUIntSliceEncode"

[[lean_lib]]
name = "ProofsUIntSliceDecode"

[[lean_lib]]
name = "ProofsSIntSliceDecode"

[[lean_lib]]
name = "ProofsErrorDefaultsHarness"

[[lean_lib]]
name = "ProofsUIntFixedWrite"

