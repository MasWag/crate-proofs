[report]
title = "Generic radix checked scalar partial helper adaptations"
explanation = """
For radix 2 through 36 and every byte slice with cursor plus remaining length
at most usize::MAX, 18 outlined partial-mode checked scalar helpers return the
exact accumulated value and absolute consumed cursor at the first nondigit or
end of input, or report the first overflow or underflow at its absolute cursor.
The terminating nondigit is excluded from the consumed count. This covers
unsigned and positive/negative signed modes for 8, 16, 32, 64, 128 and pointer
widths. Unsigned initial accumulators are arbitrary; positive and negative signed
modes require nonnegative and nonpositive initial accumulators, respectively.
"""
trusted_assumptions = "Pinned Aeneas translation, its scalar and slice models, and the Lean kernel."
limitations = """
These are slice-based outlined helper bodies. Their release macro correspondence
uses reviewed source transformations, including iterator/cursor substitution,
runtime radix, partial-mode early return, and expansion of Option::and_then.
The source comparison and native tests do not formally establish Rust-to-Rust
equivalence to the original generic parser. Unchecked prefix selection,
sign/empty handling, full frontends, format separators and multi-digit paths
are outside these 18 helper theorems.
"""
environment = """
Pinned lexical-parse-integer 1.0.6 and lexical-util 1.0.7, unmodified Aeneas and
Charon, Lean 4.35.0, macOS arm64. See profile results for run status. Native tests are separate evidence.
"""

[tool]
name = "aeneas"
version = "be86ab0f1989d04944292b345b24c435be3ad10a"
lean_dir = ".work/selected-proofs"

[[tool.proofs]]
api = "lexical_parse_integer_generic_harness::partial::checked_u8_partial"
module = "Proofs.UnsignedU8"
theorem = "LexicalGenericPartialU8Proofs.checked_u8_partial_spec"
precondition = "Initial unsigned accumulator is arbitrary; radix 2..36, cursor + bytes length fits usize. Outlined partial-mode checked helper; first nondigit returns accumulated value and absolute consumed cursor."

