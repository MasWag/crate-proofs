[report]
title = "Generic radix checked scalar helper adaptations"
explanation = """
For radix 2 through 36 and every byte slice with cursor plus length at most
usize::MAX, 18 outlined complete-mode checked scalar helpers return the first invalid digit or arithmetic overflow/underflow
at its absolute cursor, or the exact accumulated value. This covers unsigned
and positive/negative signed modes for 8, 16, 32, 64, 128 and pointer widths.
Positive and negative signed modes require nonnegative and nonpositive initial
accumulators, respectively; unsigned initial accumulators are arbitrary.
"""
trusted_assumptions = "Pinned Aeneas translation, its scalar and slice models, and the Lean kernel."
limitations = """
These are slice-based outlined helper bodies. Their release macro correspondence
uses reviewed source transformations, including iterator/cursor substitution,
runtime radix, direct complete-mode invalid-digit handling, and expansion of
Option::and_then. The source comparison and native differential tests do not
formally establish Rust-to-Rust equivalence to the original generic parser.
Unchecked prefix selection, sign/empty handling, partial mode, full frontends,
format separators and multi-digit paths are outside these 18 helper theorems.
"""
environment = """
Pinned lexical-parse-integer 1.0.6 and lexical-util 1.0.7, unmodified Aeneas and
Charon, Lean 4.35.0, macOS arm64. See profile results for run status. Native tests are separate evidence.
"""

[tool]
name = "aeneas"
version = "be86ab0f1989d04944292b345b24c435be3ad10a"
lean_dir = ".work/selected-proofs"

[[tool.proofs]]
api = "lexical_parse_integer_generic_harness::checked_u8"
module = "Proofs.UnsignedU8"
theorem = "LexicalGenericU8Proofs.checked_u8_spec"
precondition = "Initial unsigned accumulator is arbitrary; radix 2..36, cursor + bytes length fits usize. Outlined complete-mode checked helper; not a full parser."

