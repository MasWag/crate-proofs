[report]
title = "Integer parsing options in lexical-parse-integer 1.0.6"
explanation = "Seventeen extracted release methods and the STANDARD constant have total-success contracts for their Boolean option state. Builders and options preserve or set the specified state; mutable setters update their receiver and return unit. With power-of-two enabled, from_radix returns default options for every u8 argument without validating the radix."
trusted_assumptions = "Pinned Rust-to-Lean translation, Aeneas scalar models, and Lean kernel."
limitations = "The original build_strict body and its SMALL_NUMBERS and LARGE_NUMBERS constants are excluded: Aeneas encounters an internal error at its panic branch. Parser correctness is outside this profile."
environment = "Pinned unmodified Aeneas and Charon, Lean 4.35.0, macOS arm64, lexical-util 1.0.7. See profile results for run status."

[tool]
name = "aeneas"
version = "be86ab0f1989d04944292b345b24c435be3ad10a"
lean_dir = ".work/selected-proofs"

[[tool.proofs]]
api = "lexical_parse_integer::options::OptionsBuilder::new"
module = "Proofs"
theorem = "LexicalParseIntegerOptionsProofs.builder_new"
precondition = "Every call returns normally with no_multi_digit=true."

[[tool.proofs]]
api = "lexical_parse_integer::options::OptionsBuilder::get_no_multi_digit"
module = "Proofs"
theorem = "LexicalParseIntegerOptionsProofs.builder_get"
precondition = "For either Boolean state, returns that state."

