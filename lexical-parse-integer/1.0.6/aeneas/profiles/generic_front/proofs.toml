[report]
title = "Generic scalar complete and partial frontend adaptations"
explanation = """
For radix 2 through 36 and every byte slice, 24 extracted standard-syntax
no_multi_digit=true whole-input frontend adaptations return exactly the value,
error, and partial consumed count specified by the independently authored
mathematical parser. This covers complete and partial parsing of six unsigned
and six signed integer types. The usize and isize contracts require a 64-bit
platform; the other types require only the radix bound.
"""
trusted_assumptions = "Pinned Aeneas translation, its scalar and slice models, and the Lean kernel."
limitations = """
These theorems concern safe slice/cursor front-end adaptations with outlined
macros and an explicit radix. Source checks and review cover the selected release
macro and front-end transformations, including the unchecked prefix; they do not
establish formal Rust-to-Rust equivalence to the original parser or raw iterator. The
64-bit platform premise applies to usize/isize whole-input contracts. Format
separators, prefixes and suffixes, optimized multi-digit paths, and option
independence are outside this profile.
"""
environment = """
Pinned lexical-parse-integer 1.0.6 and lexical-util 1.0.7, unmodified Aeneas
and Charon, Lean 4.35.0, macOS arm64. See profile results for run status.
Native release comparisons are separate evidence.
"""

[tool]
name = "aeneas"
version = "be86ab0f1989d04944292b345b24c435be3ad10a"
lean_dir = ".work/selected-proofs"

[[tool.proofs]]
api = "lexical_parse_integer_generic_front_harness::complete_u8"
module = "FrontTrial"
theorem = "FrontTrial.complete_u8_success"
precondition = "Radix 2..36; every byte slice. Adapted standard syntax and no_multi_digit=true whole-input complete parser."

[[tool.proofs]]
api = "lexical_parse_integer_generic_front_harness::complete_u16"
module = "FrontU16Trial"
