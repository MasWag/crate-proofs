[report]
title = "bs58 0.5.1: Base58 core behavior in a Creusot proof fork"
explanation = "bs58 encodes bytes as Base58 and decodes Base58 symbols back to bytes. The verified implementation is an adapted proof fork of bs58 0.5.1, not the unchanged release. For any finite input and output capacity, the four selected fork functions satisfy the following contracts; the codec functions require a valid alphabet, which a successful `Alphabet::new` supplies.\n\n* `Alphabet::new` accepts any 58-byte array. It constructs the forward and inverse tables exactly when its bytes are distinct ASCII; otherwise it identifies the first non-ASCII or duplicate byte, including the specified indices and character.\n* The slice encoder preserves the input's base-256 numeric value in base 58 and converts each leading zero byte to one leading zero symbol. It returns the exact encoded prefix and length if it fits, or `BufferTooSmall` otherwise.\n* The decoder preserves the numeric value in base 256 and converts each leading zero symbol to one leading zero byte. For valid input it returns the exact decoded prefix and length if it fits, or `BufferTooSmall` otherwise. For invalid input it reports the first invalid character and its index unless the numeric value of an earlier valid prefix has already exceeded the buffer capacity, in which case it reports `BufferTooSmall` first. For example, with the Bitcoin alphabet and an empty buffer, `10` reports the invalid character at index 1, while `20` reports `BufferTooSmall`.\n* The fixed-array decoder has the same capacity and error rules and returns the decoded bytes followed by zeros filling the array. It does not require the decoded length to equal the array length.\n\nOn success, the slice encoder and decoder leave the rest of the supplied buffer unchanged. No rollback is promised on error. All four selected functions terminate, and their checked indexing and arithmetic obligations establish panic freedom within the modeled domains. The [specification](https://github.com/MasWag/crate-proofs/blob/90cd97eb40d26c2fd88e2a2b7b04f6c76b9e1cc8/bs58/0.5.1/creusot/verification/specification.md) gives the exact capacity and error relations."
trusted_assumptions = "The guarantees rely on the Rust compiler, Creusot's translation and shipped Rust standard-library models, Why3 transformations, and the SMT solvers. The run uses the unmodified Creusot 0.13.0 source and its matching standard models; no application algorithm or arithmetic lemma is assumed as a trusted contract. Bounds and arithmetic obligations for the selected bodies are checked under those models. Resource exhaustion is outside the model."
limitations = "The encoder is specialized to byte slices; its release counterpart accepts a generic `Clone + IntoIterator`. The fork also uses index loops, explicit reversal and equivalent bounded arithmetic expressions to expose the computation to the verifier. In the original proof crate, a shared macro emits a native `const fn` and an ordinary function for Creusot, allowing checked ghost operations. The publication fixture expands the Creusot instance into an ordinary `pub fn` with the same computation and annotations; unlike the original proof crate, that fixture does not offer a native `const fn`. Neither proof establishes Rust compiler constant-evaluation semantics. [Source correspondence](https://github.com/MasWag/crate-proofs/blob/90cd97eb40d26c2fd88e2a2b7b04f6c76b9e1cc8/bs58/0.5.1/creusot/correspondence.md) and the [publication transformation](https://github.com/MasWag/crate-proofs/blob/90cd97eb40d26c2fd88e2a2b7b04f6c76b9e1cc8/bs58/0.5.1/creusot/verification/publication/source-transformation.json) explain the changes. Review of the source and finite native comparisons support the relationship to the release, but there is no formal equivalence theorem.\n\nThe proof does not cover arbitrary generic iterators or checksum chains, public builders, allocation targets, string adapters and their unsafe UTF-8 handling, formatting, derived traits, checksums or cryptography. It does not establish whole-crate memory safety or compose the encoder and decoder into a round-trip theorem. The three findings below concern previously observed checksum behavior, separately reproduced; checksum paths are outside the formal proof."
environment = "The original accepted functional proof used unmodified Creusot 0.13.0 on x86_64 Linux with its standard models. All generated proof targets passed, including the selected bodies and their helper obligations; computationally closed roots were separately replayed with standard Why3. The [results](https://github.com/MasWag/crate-proofs/blob/90cd97eb40d26c2fd88e2a2b7b04f6c76b9e1cc8/bs58/0.5.1/creusot/verification/results.md), [evidence summary](https://github.com/MasWag/crate-proofs/blob/90cd97eb40d26c2fd88e2a2b7b04f6c76b9e1cc8/bs58/0.5.1/creusot/verification/evidence/summary.json), and [tool identities](https://github.com/MasWag/crate-proofs/blob/90cd97eb40d26c2fd88e2a2b7b04f6c76b9e1cc8/bs58/0.5.1/creusot/verification/toolchain.json) describe that run. Raw archived run evidence is local-only; a fresh clone can rerun verification.\n\nThe separate [publication fixture and recorder](https://github.com/MasWag/crate-proofs/blob/90cd97eb40d26c2fd88e2a2b7b04f6c76b9e1cc8/bs58/0.5.1/creusot/verification/publication/README.md) use a fresh run with direct solver proof search and no computational preprocessing, so its proof-tree counts differ from the original run. Standard cargo-proofs 0.4.1 records the fork's API entries and imports panic-contract verification; these entries are not imported release API coverage. The functional claims above refer to the separately documented original complete proof.\n\nSeparately, a strict native comparison of the original proof crate against the release passed 145,388 paired codec cases, 120,000 fixed-array cases and 348 constructor outcomes, plus recorded constant-evaluation examples. These finite tests support source correspondence for those cases and are not the formal proof."

[tool]
name = "creusot"
version = "0.13.0"
target = "annotated"
